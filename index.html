];const STORE='englishAdventure2_progress_v1';let saved={};try{saved=JSON.parse(localStorage.getItem(STORE)||'{}')||{}}catch(e){}if(!saved.days)saved.days={};if(!saved.wrong)saved.wrong={};if(!saved.started)saved.started=new Date().toLocaleDateString('en-CA');let mode='home',day=1,idx=0,session=[],chosen=null,correctCount=0;const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(STORE,JSON.stringify(saved))}catch(e){alert('Không thể lưu trên trình duyệt này. Hãy kiểm tra chế độ duyệt riêng tư hoặc dung lượng bộ nhớ.')}}function points(){document.getElementById('points').textContent='⭐ '+Object.values(saved.days).reduce((a,x)=>a+(x.best||0),0)+' điểm'}function completed(){return Object.keys(saved.days).filter(x=>saved.days[x].finished).length}function key(d,i){return d+':'+i}function wrongCount(){return Object.keys(saved.wrong).length}function home(){mode='home';points();const next=Array.from({length:30},(_,i)=>i+1).find(d=>!saved.days[d]?.finished)||30;app.innerHTML=`<span class="pill">📚 Global Success · Lớp 4</span><h1>Hành trình 30 ngày 🚀</h1><p class="muted">20 câu mỗi ngày · Từ vựng · Nghe · Điền từ · Sắp xếp câu</p><div class="stat"><span>🏅 ${completed()}/30 ngày</span><span>📝 ${wrongCount()} câu cần ôn</span></div><div class="progress"><div class="bar" style="width:${completed()/30*100}%"></div></div><div class="actions"><button class="btn" id="continue">▶ Học ngày ${next}</button><button class="btn secondary" id="review" ${wrongCount()?'':'disabled'}>🔁 Ôn câu sai (${wrongCount()})</button></div><div class="grid">${DATA.map(d=>`<button class="day ${saved.days[d.day]?.finished?'done':d.day===next?'current':''}" data-day="${d.day}">${saved.days[d.day]?.finished?'✅':'📖'} Ngày ${d.day}<small>${esc(d.title)}</small></button>`).join('')}</div><p class="notice">Có thể học lại bất kỳ ngày nào. Điểm cao nhất mỗi ngày được lưu. Không
