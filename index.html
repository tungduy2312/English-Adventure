<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7458d9"><meta name="apple-mobile-web-app-capable" content="yes"><title>English Adventure Lớp 4</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(160deg,#e8e2ff,#d9f5ed);color:#272443;min-height:100vh}.wrap{max-width:540px;margin:auto;padding:22px 16px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{background:white;padding:9px 13px;border-radius:24px;font-weight:700}.panel{background:#fff;border-radius:28px;padding:22px;margin-top:18px;box-shadow:0 10px 35px #51458c18}h1{font-size:27px;margin:12px 0 4px}p{line-height:1.5}.muted{color:#68647d}.hero{text-align:center;background:#f5f1ff;border-radius:20px;padding:20px 12px;margin:20px 0}.emoji{font-size:62px}.question{font-size:24px;font-weight:800;margin:8px 0}.answers{display:grid;gap:11px}.answer{border:2px solid #e6e3f0;background:#fff;border-radius:15px;padding:15px;text-align:left;font-size:17px;font-weight:650;color:#292544;min-height:58px}.answer:disabled{opacity:1}.answer.correct{background:#d9f8e9;border-color:#24a86b}.answer.wrong{background:#ffe1e5;border-color:#e35e73}.primary{border:0;background:#7054d5;color:white;font-size:18px;font-weight:800;border-radius:15px;padding:16px;width:100%;margin-top:17px;min-height:55px}.primary:disabled{background:#b6aecf}.progress{height:10px;background:#eeeaf8;border-radius:20px;overflow:hidden}.fill{height:100%;background:#52bfa0;transition:width .2s}.feedback{font-weight:650;min-height:30px;margin-top:15px}.small{font-size:13px}.speak{background:white;border:1px solid #c7baf8;border-radius:20px;padding:9px 14px;color:#5142a5;font-weight:700;margin-top:8px}button{cursor:pointer}button:focus-visible{outline:3px solid #f4b940;outline-offset:3px}</style></head><body><main class="wrap"><div class="top"><div class="pill">🎮 English Adventure</div><div class="pill" id="points">⭐ 0 điểm</div></div><section class="panel" id="game"><div class="top"><strong id="counter">Câu 1/10</strong><span class="muted">Lớp 4</span></div><div class="progress" style="margin-top:14px"><div class="fill" id="bar"></div></div><div class="hero"><div class="emoji" id="emoji">📚</div><div class="question" id="question"></div><div class="muted" id="meaning"></div><button class="speak" id="speak">🔊 Nghe tiếng Anh</button></div><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="primary" id="next" disabled>Câu tiếp theo →</button></section><p class="muted small" style="text-align:center">Bản thử nghiệm học tiếng Anh lớp 4 • Không cần đăng nhập</p></main><script>const questions=[{e:'📚',q:'What subject do you like?',vi:'Bạn thích môn học nào?',a:['I like English.','I am nine.','It is Monday.','I am fine.'],c:0,ex:'I like English = Mình thích môn Tiếng Anh.'},{e:'📅',q:'What day is it today?',vi:'Chọn câu trả lời phù hợp.',a:["It's seven o'clock.","It's Monday.","It's in May.","It's sunny."],c:1,ex:"It's Monday = Hôm nay là thứ Hai."},{e:'🍳',q:'I ___ breakfast at seven.',vi:'Điền từ còn thiếu.',a:['has','having','have','to have'],c:2,ex:'I have breakfast at seven = Mình ăn sáng lúc 7 giờ.'},{e:'🏫',q:'Where is the library?',vi:'Chọn câu trả lời chỉ vị trí.',a:['I like books.','It is big.','I read books.',"It's next to the classroom."],c:3,ex:'Next to = bên cạnh.'},{e:'🏊',q:'Can you swim?',vi:'Chọn câu trả lời khẳng định.',a:['Yes, I can.','Yes, I do.','Yes, I am.','Yes, I have.'],c:0,ex:'Can you...? → Yes, I can.'},{e:'👨‍⚕️',q:'What does your father do?',vi:'Hỏi về nghề nghiệp của bố.',a:['He is tall.','He is a doctor.','He is at home.','He is forty.'],c:1,ex:'He is a doctor = Bố là bác sĩ.'},{e:'🎒',q:'She ___ to school every day.',vi:'Chọn động từ đúng.',a:['go','going','goes','to go'],c:2,ex:'She goes: chủ ngữ she đi với goes.'},{e:'🕢',q:'What time is it?',vi:'Đồng hồ chỉ 7 giờ 30.',a:["It's seven.","It's half past six.","It's eight thirty.","It's half past seven."],c:3,ex:'Half past seven = 7 giờ 30.'},{e:'🥛',q:'Would you like some milk?',vi:'Chọn lời đáp đồng ý lịch sự.',a:['Yes, please.','I am ten.',"It's a book.",'On Monday.'],c:0,ex:'Yes, please = Vâng, cho mình xin.'},{e:'🐈',q:'There ___ two cats under the table.',vi:'Điền từ đúng.',a:['is','are','am','be'],c:1,ex:'There are dùng với danh từ số nhiều.'}];let index=0,score=0,chosen=false;const $=id=>document.getElementById(id);function render(){chosen=false;let q=questions[index];$('counter').textContent=`Câu ${index+1}/${questions.length}`;$('points').textContent=`⭐ ${score} điểm`;$('bar').style.width=`${index/questions.length*100}%`;$('emoji').textContent=q.e;$('question').textContent=q.q;$('meaning').textContent=q.vi;$('feedback').textContent='';$('next').disabled=true;$('next').textContent=index===questions.length-1?'Xem kết quả 🏆':'Câu tiếp theo →';$('answers').innerHTML='';q.a.forEach((answer,j)=>{let b=document.createElement('button');b.className='answer';b.textContent='ABCD'[j]+'. '+answer;b.addEventListener('click',()=>choose(j));$('answers').appendChild(b)})}function choose(j){if(chosen)return;chosen=true;let q=questions[index];if(j===q.c)score+=10;[...$('answers').children].forEach((b,k)=>{b.disabled=true;if(k===q.c)b.classList.add('correct');else if(k===j)b.classList.add('wrong')});$('points').textContent=`⭐ ${score} điểm`;$('feedback').textContent=(j===q.c?'🎉 Chính xác! ':'💪 Chưa đúng. ')+q.ex;$('next').disabled=false}function finish(){$('game').innerHTML=`<div style="text-align:center"><div class="emoji">🏆</div><h1>Hoàn thành!</h1><p style="font-size:40px;font-weight:850;color:#7054d5">${score}/100</p><p>${score>=80?'Xuất sắc! Bé học rất tốt!':score>=50?'Giỏi lắm! Cố gắng thêm nhé!':'Cùng ôn lại và thử lần nữa nhé!'}</p><button class="primary" id="restart">🔄 Chơi lại</button></div>`;$('restart').addEventListener('click',()=>location.reload())} $('next').addEventListener('click',()=>{if(index===questions.length-1)finish();else{index++;render()}});$('speak').addEventListener('click',()=>{if(!('speechSynthesis'in window)){alert('Trình duyệt chưa hỗ trợ đọc tiếng Anh');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(questions[index].q);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)});render();</script></body></html>
